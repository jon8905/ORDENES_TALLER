<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ClinimotosJJ</title>
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="main">
      <header class="navbar">
        <div style="display:flex;align-items:center;gap:10px">
          <button class="hamburger" id="btnMenu" type="button" aria-label="Menú">☰</button>
          <h1 id="tituloPagina">Dashboard</h1>
        </div>
        <div class="user-chip">
          <div>
            <strong id="nombreUsuario"></strong>
            <div class="muted" id="rolUsuario" style="font-size:12px"></div>
          </div>
          <div class="avatar" id="avatarUsuario">U</div>
        </div>
      </header>
      <section class="content" id="contenido"></section>
    </div>
  </div>
  <div class="overlay" id="overlay"></div>
  <div class="toast-wrap" id="toasts"></div>

  <script src="js/utils.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/modules/dashboard.js"></script>
  <script src="js/modules/usuarios.js"></script>
  <script src="js/modules/tecnicos.js"></script>
  <script src="js/modules/clientes.js"></script>
  <script src="js/modules/motocicletas.js"></script>
  <script src="js/modules/ordenes.js"></script>
  <script src="js/modules/manoObra.js"></script>
  <script src="js/modules/reportes.js"></script>
  <script src="js/modules/repuestos.js"></script>
  <script src="js/modules/historial.js"></script>
  <script src="js/modules/liquidaciones.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
